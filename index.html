<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A1118">
<meta name="description" content="Bhabhi Thulla - the classic card game. Play online with friends or offline against the computer.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bhabhi Thulla">

<link rel="apple-touch-icon" href="icon-192.png">
<title>Bhabhi Thulla</title>

window.__errs=[];
function __showBootErr(msg){ var el=document.getElementById('bootErr'); if(!el) return; el.querySelector('p').textContent=msg; el.style.display='flex'; }
window.addEventListener('error',function(e){ window.__errs.push((e.message||'Script error')+(e.lineno?' (line '+e.lineno+')':'')); if(!window.__booted) __showBootErr('Error: '+window.__errs.join(' | ')); });
setTimeout(function(){ if(!window.__booted) __showBootErr(window.__errs.length?('Error: '+window.__errs.join(' | ')):'Loading is taking too long. Tap Reload. If it keeps happening, re-upload index.html to GitHub using "Upload files" (not copy-paste).'); },7000);
function __hardReload(){ try{ if(navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(r){ r.forEach(function(x){x.unregister();}); }); if(window.caches) caches.keys().then(function(k){ k.forEach(function(n){caches.delete(n);}); }); }catch(e){} setTimeout(function(){ location.reload(); },400); }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#0A1118; --bg2:#122230; --panel:rgba(255,255,255,.045); --line:rgba(212,175,55,.28);
  --gold:#D9B45A; --gold-hi:#F3DB94; --gold-lo:#9C7428; --ivory:#F6F1E4; --muted:#93A3B3; --ink:#15120C;
  --red:#D3343F; --emerald:#1F7A47; --cw:60px; --ch:85px;
  --display:'Cinzel', 'Times New Roman', serif; --font:'Outfit', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--font);color:var(--ivory);background:var(--bg);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.bgfx{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 80% 60% at 50% 40%, rgba(31,122,71,.18), transparent 70%),
  radial-gradient(ellipse 60% 50% at 50% 110%, rgba(217,180,90,.10), transparent 70%), var(--bg)}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
#app{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media (orientation:portrait){
  body.ingame #app{inset:auto;top:0;left:100vw;width:100vh;height:100vw;transform-origin:0 0;transform:rotate(90deg);
    padding:env(safe-area-inset-left,0px) env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px)}
  @supports (height:100dvh){ body.ingame #app{width:100dvh} }
}
.screen{display:none;height:100%;flex-direction:column;position:relative}
.screen.on{display:flex}
.credit{font-family:var(--font);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(217,180,90,.55)}
.credit b{color:var(--gold);font-weight:600}

/* ---------- controls ---------- */
.btn{font-size:16px;font-weight:600;letter-spacing:.04em;padding:12px 18px;border-radius:12px;color:var(--ink);
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 45%,var(--gold-lo));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 16px rgba(0,0,0,.35);transition:transform .12s, filter .12s}
.btn:active{transform:translateY(1px) scale(.99);filter:brightness(.95)}
.btn.sec{color:var(--ivory);background:rgba(255,255,255,.05);border:1px solid var(--line);box-shadow:none}
.btn.emer{color:#fff;background:linear-gradient(180deg,#2E9A5C,#1A6A3D);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(0,0,0,.35)}
.btn.sm{padding:9px 14px;font-size:14px}
.ibtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:rgba(10,17,24,.72);border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:19px;height:19px;fill:none;stroke:var(--gold-hi);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ibtn.off svg{stroke:var(--muted)}
input{font-family:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.12);
  background:rgba(0,0,0,.35);color:var(--ivory);width:100%}
input:focus{border-color:var(--gold)}
input::placeholder{color:#64758A}
label.lbl{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-top:6px}

/* ---------- splash ---------- */
#splash{align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at center,#14283A,var(--bg) 70%);z-index:900}
.crest{width:96px;height:96px;filter:drop-shadow(0 8px 24px rgba(217,180,90,.25))}
.ttl{font-family:var(--display);font-weight:700;letter-spacing:.12em;color:var(--gold-hi);text-align:center;line-height:1.05}
.ttl small{display:block;font-family:var(--font);font-weight:500;font-size:.32em;letter-spacing:.24em;color:var(--muted);margin-top:8px}
#splash .ttl{font-size:34px}
.bar{width:220px;height:3px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-lo),var(--gold-hi));transition:width .2s}
#splash .credit{position:absolute;bottom:22px}
.bootErr{display:none;flex-direction:column;align-items:center;gap:10px;max-width:420px;text-align:center;font-size:13px;color:#FF9AA0;padding:0 16px}
#splash.hide{opacity:0;transition:opacity .5s;pointer-events:none}

/* ---------- home ---------- */
#home{padding:14px 18px;overflow:auto}
.homegrid{margin:auto;display:flex;gap:44px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;max-width:880px}
.brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.fan{position:relative;width:200px;height:132px;margin-bottom:14px}
.fan i{position:absolute;bottom:0;left:50%;width:78px;height:111px;background-size:100% 100%;border-radius:7px;box-shadow:0 10px 24px rgba(0,0,0,.5)}
.fan i:nth-child(1){transform:translateX(-100%) rotate(-16deg);transform-origin:bottom right}
.fan i:nth-child(2){transform:translateX(-50%) translateY(-12px)}
.fan i:nth-child(3){transform:rotate(16deg);transform-origin:bottom left}
.brand .ttl{font-size:40px}
.panel{width:100%;max-width:350px;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
  border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.seg{display:flex;gap:4px;background:rgba(0,0,0,.35);padding:4px;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:rgba(217,180,90,.16);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(217,180,90,.4)}
.row{display:flex;gap:8px}
.row input{text-transform:uppercase;letter-spacing:.4em;text-align:center;font-weight:600}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;letter-spacing:.2em;text-transform:uppercase;margin:4px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.1)}
#installBtn{display:none}
#installBtn.on{display:flex;align-items:center;justify-content:center;gap:8px}
#home .credit{margin-top:6px}

/* ---------- lobby ---------- */
#lobby{align-items:center;justify-content:safe center;padding:18px;gap:16px;overflow:auto}
.codebox{text-align:center;padding:12px 30px;border-radius:16px;border:1px solid var(--line);background:var(--panel)}
.codebox small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.codebox b{display:block;font-family:var(--display);font-size:40px;letter-spacing:.3em;color:var(--gold-hi);line-height:1.1;padding-left:.3em}
.plist{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;max-width:640px}
.lp{display:flex;flex-direction:column;align-items:center;gap:6px;width:86px;--av:56px}
.lp .nm{font-size:14px;font-weight:500;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp .host{font-size:10px;letter-spacing:.18em;color:var(--gold);text-transform:uppercase}
.hint{color:var(--muted);font-size:14px;text-align:center;max-width:380px}

/* ---------- avatars ---------- */
.av{width:var(--av,52px);height:var(--av,52px);border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;
  font-family:var(--display);font-size:calc(var(--av,52px)*.42);font-weight:700;color:#fff;
  border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(10,17,24,.85),0 6px 14px rgba(0,0,0,.5),inset 0 -8px 14px rgba(0,0,0,.35),inset 0 6px 10px rgba(255,255,255,.18)}

/* ================= GAME ================= */
#game{overflow:hidden}
#game.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate3d(-2px,1px,0)}20%,80%{transform:translate3d(5px,-2px,0)}30%,50%,70%{transform:translate3d(-9px,3px,0)}40%,60%{transform:translate3d(9px,-3px,0)}}
#tableCv{position:absolute;pointer-events:none}
.layer{position:absolute;inset:0;pointer-events:none}
.tbar{position:absolute;top:8px;left:10px;display:flex;gap:8px;z-index:300;align-items:center}
.tbar.right{left:auto;right:10px}
.roomtag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);background:rgba(10,17,24,.72);padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.08);white-space:nowrap}
.roomtag b{color:var(--gold-hi);font-weight:600}

/* sprites */
.sp{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);will-change:transform;
  transition:transform .62s cubic-bezier(.22,.8,.24,1),opacity .45s;perspective:700px;pointer-events:none;touch-action:none}
.sp.notr{transition:none}
.sp.slow{transition:transform .78s cubic-bezier(.5,0,.2,1),opacity .6s .25s}
.sp .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1)}
.sp.down .in{transform:rotateY(180deg)}
.sp .f,.sp .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background-size:100% 100%;
  border-radius:calc(var(--cw)*.08);box-shadow:0 3px 8px rgba(0,0,0,.42)}
.sp .b{transform:rotateY(180deg)}
.sp .f::after{content:"";position:absolute;inset:0;border-radius:inherit;background:rgba(6,12,18,.55);opacity:0;transition:opacity .25s}
.sp.dim .f::after{opacity:1}
.sp.ok .f::before{content:"";position:absolute;inset:-2px;border-radius:calc(var(--cw)*.1);border:2px solid var(--gold-hi);box-shadow:0 0 14px rgba(243,219,148,.55)}
.sp.hand{pointer-events:auto;cursor:grab}
.sp.drag{z-index:400!important;cursor:grabbing}
.sp.drag .f{box-shadow:0 18px 30px rgba(0,0,0,.55)}
.sp.th .f{box-shadow:0 0 0 2px #FF5A64,0 0 26px 6px rgba(211,52,63,.85)}
.pile{position:absolute;left:0;top:0;pointer-events:none}
.pile i{position:absolute;width:var(--cw);height:var(--ch);background-size:100% 100%;border-radius:calc(var(--cw)*.08);box-shadow:0 2px 6px rgba(0,0,0,.4)}

/* seats */
.seat{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;--av:var(--avs,52px);pointer-events:none;z-index:200}
.avw{position:relative}
.ring{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);opacity:0;pointer-events:none;transition:opacity .3s}
.turn .ring{opacity:1;animation:spin 1.6s linear infinite}
.turn .av{box-shadow:0 0 0 3px rgba(10,17,24,.85),0 0 22px 4px rgba(243,219,148,.45),inset 0 -8px 14px rgba(0,0,0,.35)}
@keyframes spin{to{transform:rotate(360deg)}}
.cnt{position:absolute;top:-4px;right:-14px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;background:#0E1A24;
  border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--gold-hi);box-shadow:0 3px 8px rgba(0,0,0,.5)}
.out .cnt{background:var(--emerald);color:#fff;border-color:#7FE0A6}
.plate{margin-top:8px;padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.06em;white-space:nowrap;max-width:120px;
  overflow:hidden;text-overflow:ellipsis;background:rgba(10,17,24,.85);border:1px solid var(--line);color:var(--ivory);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.turn .plate{border-color:var(--gold-hi);color:var(--gold-hi)}
.tag{font-size:9px;letter-spacing:.14em;color:var(--muted);margin-top:3px;text-transform:uppercase}
.out .av{opacity:.5;filter:grayscale(.7)}
.dc{position:absolute;bottom:0;left:-2px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid #0A1118;display:none}
.offl .dc{display:block}
.seat.hit .av{animation:hit .9s ease}
@keyframes hit{0%,100%{box-shadow:0 0 0 3px rgba(10,17,24,.85)}30%{box-shadow:0 0 0 3px #FF5A64,0 0 34px 10px rgba(211,52,63,.9)}}
#me{left:12px;bottom:10px;top:auto;transform:none}

.statusPill{position:absolute;left:0;top:0;z-index:250;padding:5px 16px;border-radius:999px;font-size:14px;font-weight:500;letter-spacing:.02em;
  white-space:nowrap;max-width:70%;overflow:hidden;text-overflow:ellipsis;background:rgba(10,17,24,.82);border:1px solid rgba(255,255,255,.1);transition:background .3s,color .3s}
.statusPill.mine{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:var(--ink);border-color:transparent;font-weight:600}
.statusPill .ls{font-size:1.15em;vertical-align:-1px}

.bubble{position:absolute;left:0;top:0;z-index:400;font-size:36px;pointer-events:none;animation:pop 2s ease forwards}
@keyframes pop{0%{transform:translate(-50%,-40%) scale(.3);opacity:0}15%{transform:translate(-50%,-120%) scale(1.12);opacity:1}25%{transform:translate(-50%,-110%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-170%);opacity:0}}

/* ---------- THULLA FX ---------- */
.flash{position:absolute;inset:0;pointer-events:none;z-index:340;opacity:0;background:radial-gradient(ellipse at center, rgba(211,52,63,.0) 30%, rgba(211,52,63,.55) 100%)}
.flash.go{animation:flash 1.1s ease-out}
@keyframes flash{0%{opacity:0}8%{opacity:1}100%{opacity:0}}
.wave{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:3px solid #FF6A72;pointer-events:none;z-index:330;animation:wave .8s ease-out forwards}
.wave.w2{border-color:var(--gold-hi);animation-delay:.12s;opacity:0}
@keyframes wave{0%{transform:scale(.3);opacity:1}100%{transform:scale(7);opacity:0}}
.spark{position:absolute;left:0;top:0;width:7px;height:7px;margin:-3px;border-radius:50%;pointer-events:none;z-index:335;animation:spark .9s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.stamp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;pointer-events:none;opacity:0;z-index:350}
.stamp b{font-family:var(--display);font-size:clamp(46px,13vmin,72px);font-weight:800;letter-spacing:.06em;color:#fff;line-height:1;padding:6px 30px 2px;
  background:linear-gradient(180deg,#E8434E,#9E1823);border:3px solid #FFD0D3;border-radius:10px;transform:rotate(-7deg);
  box-shadow:0 0 0 6px rgba(158,24,35,.35),0 18px 40px rgba(0,0,0,.6);text-shadow:0 3px 0 #6E0E16}
.stamp span{font-size:16px;font-weight:600;letter-spacing:.08em;color:#fff;background:rgba(10,17,24,.85);padding:5px 16px;border-radius:999px;border:1px solid rgba(255,90,100,.6)}
.stamp.go{animation:stampWrap 2.3s ease-out}
.stamp.go b{animation:slam 2.3s cubic-bezier(.2,1.4,.4,1)}
@keyframes stampWrap{0%{opacity:0}6%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes slam{0%{transform:rotate(-7deg) scale(3.2)}14%{transform:rotate(-7deg) scale(.9)}20%{transform:rotate(-7deg) scale(1.05)}26%,100%{transform:rotate(-7deg) scale(1)}}

/* ---------- overlays ---------- */
.ov{position:absolute;inset:0;background:rgba(4,8,12,.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:500}
.ov.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.box{background:linear-gradient(180deg,#14232F,#0D1720);border:1px solid var(--line);border-radius:18px;padding:20px 22px;width:100%;
  max-width:400px;max-height:94%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.box h2{font-family:var(--display);font-size:24px;letter-spacing:.06em;color:var(--gold-hi);line-height:1.15}
.box .big{font-size:46px;line-height:1}
.box ol{text-align:left;padding-left:22px;font-size:15px;color:var(--muted);line-height:1.6}
.rules{text-align:left;font-size:14px;line-height:1.5;display:flex;flex-direction:column;gap:7px;color:#C9D3DC}
.rules b{color:var(--gold-hi);font-weight:600}
.emojis{position:absolute;top:56px;left:10px;z-index:450;background:rgba(10,17,24,.96);border:1px solid var(--line);border-radius:14px;padding:8px;display:none;grid-template-columns:repeat(4,44px);gap:4px}
.emojis.on{display:grid}
.emojis button{font-size:26px;height:44px;border-radius:10px;background:rgba(255,255,255,.04)}
.toast{position:absolute;left:50%;bottom:36%;transform:translateX(-50%);background:rgba(10,17,24,.95);color:#fff;border:1px solid rgba(255,90,100,.6);
  padding:9px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:opacity .25s;z-index:600;max-width:90%;text-align:center;pointer-events:none}
.toast.on{opacity:1}
.conn{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(10,17,24,.95);border:1px solid var(--line);color:var(--gold-hi);
  padding:6px 16px;border-radius:12px;font-size:13px;display:none;z-index:600}
.conn.on{display:block}
@media (prefers-reduced-motion:reduce){ .sp,.sp .in{transition-duration:.01s} .turn .ring,.bubble,#game.shake{animation:none} }
@media (max-height:460px){
  .homegrid{gap:28px} .brand{gap:8px} .brand .ttl{font-size:30px} .fan{height:104px;width:170px} .fan i{width:62px;height:88px}
  .panel{padding:12px 14px;gap:7px;max-width:330px} .panel input{padding:9px 12px} .panel .btn{padding:9px 14px;font-size:15px} label.lbl{margin-top:0}
  .seg button{padding:6px 0} .divider{margin:0} }
</style>
</head>
<body>
<div class="bgfx"></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3DB94"/><stop offset=".5" stop-color="#D9B45A"/><stop offset="1" stop-color="#9C7428"/></linearGradient>
  <symbol id="crest" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#0E1A24" stroke="url(#gGold)" stroke-width="3"/><circle cx="50" cy="50" r="39" fill="none" stroke="url(#gGold)" stroke-width="1" opacity=".6"/>
  <path fill="url(#gGold)" d="M50 20c-6 9-20 16-20 28a11 11 0 0 0 17 9l-4 15h14l-4-15a11 11 0 0 0 17-9c0-12-14-19-20-28z"/></symbol>
</defs></svg>

<div id="app">
<!-- SPLASH -->
<section id="splash" class="screen on">
  <svg class="crest"><use href="#crest"/></svg>
  <div class="ttl">BHABHI THULLA<small>Classic card game</small></div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="bootErr"
